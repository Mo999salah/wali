name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vMAJOR.MINOR.PATCH, got: ${tag}"
            exit 1
          fi
          expected="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          if [[ "$cargo_version" != "$expected" ]]; then
            echo "tag ${tag} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "version ${cargo_version} matches ${tag}"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            pkg-config \
            rpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Linux packages
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          args: --bundles deb,rpm
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadPlainBinary: false

      - name: Verify packages, inspect, and checksum
        run: |
          set -euo pipefail
          if find src-tauri/target/release/bundle/appimage -name '*.AppImage' 2>/dev/null | grep -q .; then
            echo "unexpected AppImage artifact"
            exit 1
          fi
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' -type f -printf '%p\n')"
          rpm="$(find src-tauri/target/release/bundle/rpm -name '*.rpm' -type f -printf '%p\n')"
          if [[ -z "$deb" || "$(printf '%s\n' "$deb" | wc -l)" -ne 1 || ! -s "$deb" ]]; then
            echo "expected one non-empty .deb in bundle/deb"
            exit 1
          fi
          if [[ -z "$rpm" || "$(printf '%s\n' "$rpm" | wc -l)" -ne 1 || ! -s "$rpm" ]]; then
            echo "expected one non-empty .rpm in bundle/rpm"
            exit 1
          fi

          echo "=== dpkg-deb -I ==="
          dpkg-deb -I "$deb"
          echo "=== dpkg-deb -c ==="
          dpkg-deb -c "$deb"
          echo "=== rpm -qip ==="
          rpm -qip "$rpm"
          echo "=== rpm -qpR ==="
          rpm -qpR "$rpm"
          echo "=== rpm -qlp ==="
          rpm -qlp "$rpm"

          deb_list="$(dpkg-deb -c "$deb")"
          rpm_list="$(rpm -qlp "$rpm")"
          echo "$deb_list" | grep -q 'usr/bin/wali'
          echo "$deb_list" | grep -q 'Wali.desktop'
          echo "$deb_list" | grep -q 'hicolor/.*/apps/wali.png'
          echo "$rpm_list" | grep -q '/usr/bin/wali'
          echo "$rpm_list" | grep -q 'Wali.desktop'
          echo "$rpm_list" | grep -q 'hicolor/.*/apps/wali.png'
          if echo "$deb_list$rpm_list" | grep -Ei 'IndexedDB|Local Storage|service.?worker'; then
            echo "package contains session-like paths"
            exit 1
          fi

          mkdir -p dist
          cp "$deb" "$rpm" dist/
          (cd dist && sha256sum -- *.deb *.rpm) > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(dist/*.deb dist/*.rpm dist/SHA256SUMS)
          if [[ ${#files[@]} -lt 3 ]]; then
            echo "expected .deb, .rpm, and SHA256SUMS"
            ls -la dist || true
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --draft \
              --title "Wali ${tag}" \
              --generate-notes
          fi
